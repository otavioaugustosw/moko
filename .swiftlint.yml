# Active project sources only; archived snapshots and build artifacts are outside this tree.
included:
  - App
trailing_comma:
  mandatory_comma: true
line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
  ignores_multiline_strings: true
identifier_name:
  min_length: 2
  excluded: [id, i, x, y]
function_body_length:
  warning: 150
  error: 250
type_body_length:
  warning: 500
  error: 800
file_length:
  warning: 900
  error: 1200
function_parameter_count:
  warning: 8
  error: 12
large_tuple:
  warning: 5
  error: 7
cyclomatic_complexity:
  warning: 20
  error: 30
