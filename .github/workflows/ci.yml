# Tier 1 (every push/PR): lint + project drift, and compile + run the deterministic
# check executables against a *compile-only* runtime payload assembled from Homebrew.
# The real Local/Runtime payload (PostgreSQL/PHP/MariaDB servers) is not needed for
# the Checks scheme: those targets only need libpq/libmariadb headers and dylibs.
# The app target itself (embed-runtimes.py) and RuntimeInstallChecks need the full
# payload and stay out of CI until a payload artefact exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deployment target is macOS 26, so every job runs on the macos-26 image (Xcode 26).
jobs:
  lint:
    name: Lint and project drift
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install swiftlint xcodegen
          swiftlint version
          xcodegen --version

      - name: XcodeGen project is in sync with project.yml
        run: |
          cd App
          xcodegen generate --spec project.yml
          if ! git diff --quiet -- moko.xcodeproj; then
            echo "::error file=App/project.yml::moko.xcodeproj is out of date. Run 'xcodegen generate' in App/ and commit the result."
            git diff --stat -- moko.xcodeproj
            exit 1
          fi

      - name: SwiftLint (strict)
        # lint.sh exits 0 when SwiftLint is missing; installed above, so this is the real pass.
        run: zsh App/Support/lint.sh

      - name: swift-format (views)
        run: xcrun swift-format lint --strict --configuration .swift-format --recursive App/Sources/Views

  checks:
    name: Build and run checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compile-only runtime payload (Homebrew libpq + MariaDB Connector/C)
        run: |
          brew install libpq mariadb-connector-c
          pq="$(brew --prefix libpq)"; maria="$(brew --prefix mariadb-connector-c)"
          payload=Local/Runtime/Payload
          mkdir -p "$payload/Headers/PostgreSQL" "$payload/Headers/mariadb" "$payload/Frameworks"
          cp -R "$pq/include/." "$payload/Headers/PostgreSQL/"
          cp -R "$maria/include/mariadb/." "$payload/Headers/mariadb/"
          cp -L "$pq/lib/libpq.5.dylib" "$maria/lib/mariadb/libmariadb.3.dylib" "$payload/Frameworks/"
          ln -sf libpq.5.dylib "$payload/Frameworks/libpq.dylib"
          ln -sf libmariadb.3.dylib "$payload/Frameworks/libmariadb.dylib"

      - name: Warn on drift from Runtime.lock.json
        run: |
          for formula in libpq mariadb-connector-c; do
            locked="$(python3 -c "import json,sys;print(json.load(open('App/Config/Runtime.lock.json'))[sys.argv[1]]['version'])" "$formula")"
            installed="$(brew list --versions "$formula" | awk '{print $2}')"
            if [ "${installed%%_*}" != "$locked" ]; then
              echo "::warning::$formula is $installed on the runner, $locked in Runtime.lock.json"
            fi
          done

      - name: Build Checks scheme
        run: |
          set -o pipefail
          xcodebuild build -project App/moko.xcodeproj -scheme Checks -configuration Debug \
            -derivedDataPath build -destination 'platform=macOS,arch=arm64' | xcbeautify || exit 1

      - name: Run check executables
        run: |
          products=build/Build/Products/Debug
          for check in RefreshChecks FormChecks ConnectionChecks PHPProjects ComponentChecks; do
            echo "::group::$check"
            "$products/$check"
            echo "::endgroup::"
          done

  interface:
    name: Interface tests (XCTest)
    runs-on: macos-26
    timeout-minutes: 40
    # UI tests on hosted runners still need to prove stable; flip to blocking once green for a while.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compile-only runtime payload
        run: |
          brew install libpq mariadb-connector-c
          pq="$(brew --prefix libpq)"; maria="$(brew --prefix mariadb-connector-c)"
          payload=Local/Runtime/Payload
          mkdir -p "$payload/Headers/PostgreSQL" "$payload/Headers/mariadb" "$payload/Frameworks"
          cp -R "$pq/include/." "$payload/Headers/PostgreSQL/"
          cp -R "$maria/include/mariadb/." "$payload/Headers/mariadb/"
          cp -L "$pq/lib/libpq.5.dylib" "$maria/lib/mariadb/libmariadb.3.dylib" "$payload/Frameworks/"
          ln -sf libpq.5.dylib "$payload/Frameworks/libpq.dylib"
          ln -sf libmariadb.3.dylib "$payload/Frameworks/libmariadb.dylib"

      - name: Test Interface scheme (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild test -project App/moko.xcodeproj -scheme Interface \
            -derivedDataPath build -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/Interface.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | xcbeautify || exit 1

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Interface.xcresult
          path: build/Interface.xcresult
